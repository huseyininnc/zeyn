[package]
name = "zeyn"
description = "Rust web framework for data heavy applications, written by AI agents and reviewed by people"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
keywords = ["web", "framework", "datagrid", "forms", "axum"]
categories = ["web-programming::http-server", "gui"]

[features]
default = ["server"]
server = ["dep:axum", "dep:tokio", "dep:getrandom", "dep:tower-http", "dep:futures-core", "dep:tracing-subscriber", "dep:flate2"]
signed-licenses = ["dep:ed25519-dalek"]
redis = ["server", "dep:redis"]
otel = ["server", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
# Embedded AI assistant with LLM and speech providers over HTTP. Off unless an app asks for it.
assistant = ["server", "dep:reqwest", "dep:rustls"]
# Data layer (`zeyn::sql`). Apps without a database enable neither and pay nothing.
postgres = ["dep:sqlx", "dep:base64", "dep:tokio", "dep:futures-core", "dep:futures-util"]
# Oracle through ODPI-C; needs Oracle Instant Client at run time (see docs/database.md).
oracle = ["dep:oracle", "dep:base64", "dep:tokio", "dep:futures-core"]
# Sign in with an OpenID Connect provider and bearer JWTs for APIs and MCP. See docs/auth.md.
oidc = ["server", "dep:reqwest", "dep:rustls", "dep:ring"]
# Built in TOTP second factor for apps without an identity provider. See docs/auth.md.
totp = ["server", "dep:ring", "dep:totp-rs", "dep:qrcodegen"]
# WASM islands (`ui::Island`, `App::islands`). Pages without an island pay nothing either way.
islands = ["server", "dep:zeyn-island", "tokio/fs"]
# WebSocket rooms with Y-CRDT documents and change topics (`realtime::Realtime`, `ui::Live`).
# Off by default: requests stay stateless unless an app turns this on.
realtime = ["server", "axum/ws", "dep:yrs", "dep:futures-util", "futures-util/sink"]
# Grid export to XLSX and XLSX import.
xlsx = ["dep:rust_xlsxwriter", "dep:calamine", "dep:zip"]
# PDF documents from Typst templates, and grid export to PDF.
pdf = ["server", "dep:typst", "dep:typst-layout", "dep:typst-pdf"]
# E-mail notifications over SMTP, sent from a background job.
email = ["server", "dep:lettre"]
# Optional user accounts with the structure of ASP.NET Core Identity: stores, managers, Argon2id
# passwords, purpose tokens, sealed session cookies, two factor, passkeys and a default UI.
# Off unless an app asks for it. See docs/accounts.md.
accounts = ["totp", "dep:argon2", "dep:base64", "dep:unicode-normalization"]
# The `ui::Markdown` component: safe Markdown to HTML, with no dependencies.
markdown = []
# Framework texts (`zeyn.*`) in more languages. English and Turkish are always built in; each
# language adds its catalog (35 to 60 KB of JSON) to the binary. An app offers a language by adding its
# own catalog for it (`I18n::catalog`). See examples/docs/pages/texts.md.
lang-zh = []
lang-ru = []
lang-es = []
lang-ko = []
lang-ja = []
lang-hi = []
lang-ar = []
lang-all = ["lang-zh", "lang-ru", "lang-es", "lang-ko", "lang-ja", "lang-hi", "lang-ar"]

[dependencies]
zeyn-macros = { path = "../zeyn-macros", version = "0.0.5" }
zeyn-island = { path = "../zeyn-island", version = "0.0.5", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"], optional = true }
futures-core = { version = "0.3", optional = true }
getrandom = { version = "0.2", optional = true }
tower-http = { version = "0.6", features = ["cors", "compression-gzip"], optional = true }
flate2 = { version = "1.1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
ed25519-dalek = { version = "3", default-features = false, optional = true }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"], optional = true }
ring = { version = "0.17", optional = true }
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth"], optional = true }
qrcodegen = { version = "1.8", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"], optional = true }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client"], optional = true }
tracing-opentelemetry = { version = "0.34", default-features = false, optional = true }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "migrate"], optional = true }
base64 = { version = "0.22", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
oracle = { version = "0.6", optional = true }
yrs = { version = "0.28", optional = true }
rust_xlsxwriter = { version = "0.102", default-features = false, features = ["constant_memory"], optional = true }
calamine = { version = "0.38", default-features = false, optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
typst = { version = "0.15", optional = true }
typst-layout = { version = "0.15", optional = true }
typst-pdf = { version = "0.15", optional = true }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"], optional = true }
unicode-normalization = { version = "0.1", optional = true }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1", "tokio1-rustls-tls", "file-transport"], optional = true }

[dev-dependencies]
ring = "0.17"
base64 = "0.22"
ed25519-dalek = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
yrs = "0.28"
calamine = { version = "0.38", default-features = false }
rust_xlsxwriter = { version = "0.102", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1.1"

[[test]]
name = "assistant"
required-features = ["assistant"]

[[test]]
name = "oidc"
required-features = ["oidc"]

[[test]]
name = "totp"
required-features = ["totp"]

[[test]]
name = "islands"
required-features = ["islands"]

[[test]]
name = "realtime"
required-features = ["realtime"]

[[test]]
name = "xlsx"
required-features = ["xlsx"]

[[test]]
name = "xlsx_memory"
required-features = ["xlsx"]

[[test]]
name = "pdf"
required-features = ["pdf"]

[[test]]
name = "pdf_measure"
required-features = ["pdf"]

[[test]]
name = "accounts"
required-features = ["accounts"]

[[test]]
name = "ui_markdown"
required-features = ["markdown"]

[[test]]
name = "accounts_passkeys"
required-features = ["accounts"]

[[test]]
name = "accounts_sql"
required-features = ["accounts", "postgres"]

[[test]]
name = "mail"
required-features = ["email"]
