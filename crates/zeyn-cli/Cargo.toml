[package]
name = "zeyn-cli"
description = "Command line tool for Zeyn Framework: new projects, generators, checks and an MCP server for agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
keywords = ["zeyn", "web", "framework", "scaffolding", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "zeyn"
path = "src/main.rs"

[dependencies]
serde_json = "1"
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
getrandom = "0.2"

[dev-dependencies]
zeyn = { path = "../zeyn", default-features = false, features = ["signed-licenses"] }
