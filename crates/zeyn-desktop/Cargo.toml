[package]
name = "zeyn-desktop"
description = "Runs a Zeyn app as a desktop app in the system WebView, served from a guarded loopback server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true

[dependencies]
zeyn = { path = "../zeyn", version = "0.0.6" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
getrandom = "0.2"
serde_json = "1"
dirs = "7"
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
