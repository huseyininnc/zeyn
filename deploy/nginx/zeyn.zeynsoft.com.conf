# zeynsoft.com (landing), docs.zeynsoft.com (documentation), framework.zeynsoft.com (live demo).
# Certificates are added by certbot --nginx. HSTS has no includeSubDomains: other subdomains
# on this host are not all served over HTTPS. /opt/zeyn/docs-llms.txt is a copy of
# examples/docs/llms.txt for docs images built before App::llms_txt.

server {
    listen 80;
    server_name zeynsoft.com www.zeynsoft.com;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name docs.zeynsoft.com;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /llms.txt {
        alias /opt/zeyn/docs-llms.txt;
        default_type text/plain;
        charset utf-8;
    }
    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name framework.zeynsoft.com;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
