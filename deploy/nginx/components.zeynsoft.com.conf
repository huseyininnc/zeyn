# components.zeynsoft.com: the component catalog (examples/components). Certificate added by
# certbot --nginx -d components.zeynsoft.com.

server {
    listen 80;
    server_name components.zeynsoft.com;
    add_header Strict-Transport-Security "max-age=31536000" always;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json text/plain image/svg+xml;
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
