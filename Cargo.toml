[workspace]
resolver = "3"
members = ["crates/zeyn", "crates/zeyn-macros", "crates/zeyn-cli", "crates/zeyn-desktop", "examples/big-grid", "examples/inventory", "examples/showcase", "examples/shared-domain", "examples/billing", "examples/crm", "examples/adisyon", "examples/docs", "examples/components", "examples/widget", "examples/admin", "crates/zeyn-island", "examples/showcase/shared", "examples/showcase/islands/counter", "examples/showcase/islands/diagram", "tools/playground", "tools/playground/harness"]

[workspace.package]
version = "0.0.14"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/huseyininnc/zeyn"
readme = "README.md"
homepage = "https://zeynsoft.com"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

# The framework crate is rebuilt after every change to it and is the longest step of most builds;
# without line tables its one line rebuild is about 12 percent faster and its rlib 20 percent
# smaller (CONTRIBUTING.md, "Where the build time goes"). Panic messages keep their file and line.
[profile.dev.package.zeyn]
debug = false
