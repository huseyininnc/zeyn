- main:
  - region "Price":
    - heading "Price" [level=1]
    - paragraph: A price with a struck old price, the percent off and a unit price.
    - link "Documentation (external site)":
      - /url: https://docs.zeynsoft.com/components/commerce#price
    - link "API reference on docs.rs (external site)":
      - /url: https://docs.rs/zeyn/latest/zeyn/?search=Price
    - tablist "Price sections":
      - tab "Overview" [selected]
      - tab "API"
      - tab "Examples"
    - tabpanel "Overview":
      - heading "Example" [level=3]
      - text: /Was ₺\d+,\d+\.\d+, now ₺\d+,\d+\.\d+, \d+% off ₺\d+\.\d+ Was \$\d+\.\d+, now \$\d+\.\d+, \d+% off/
      - group: Show code
      - button "Copy"
      - status