- main:
  - region "ActivityRings":
    - heading "ActivityRings" [level=1]
    - paragraph: Shares of several goals as rings inside one another.
    - link "Documentation (external site)":
      - /url: https://docs.zeynsoft.com/components/data#activityrings
    - link "API reference on docs.rs (external site)":
      - /url: https://docs.rs/zeyn/latest/zeyn/?search=ActivityRings
    - tablist "ActivityRings sections":
      - tab "Overview" [selected]
      - tab "API"
      - tab "Examples"
    - tabpanel "Overview":
      - heading "Example" [level=3]
      - group "Today":
        - list:
          - listitem: /Orders packed \d+%/
          - listitem: /Calls answered \d+%/
          - listitem: /Returns handled \d+%/
      - group: Show code
      - button "Copy"
      - status