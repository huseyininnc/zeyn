- main:
  - region "DataGrid":
    - heading "DataGrid" [level=1]
    - paragraph: Rows of an action with paging, sorting and filters.
    - link "Documentation (external site)":
      - /url: https://docs.zeynsoft.com/language/datagrid
    - link "API reference on docs.rs (external site)":
      - /url: https://docs.rs/zeyn/latest/zeyn/?search=DataGrid
    - tablist "DataGrid sections":
      - tab "Overview" [selected]
      - tab "API"
      - tab "Examples"
    - tabpanel "Overview":
      - heading "Example" [level=3]
      - grid:
        - rowgroup:
          - 'row "Code Column options: Code Resize Code Name Column options: Name Resize Name Kind Column options: Kind Resize Kind Price Column options: Price Resize Price Stock Column options: Stock Resize Stock"':
            - 'columnheader "Code Column options: Code Resize Code"':
              - button "Code"
              - 'button "Column options: Code"'
              - separator "Resize Code"
            - 'columnheader "Name Column options: Name Resize Name"':
              - button "Name"
              - 'button "Column options: Name"'
              - separator "Resize Name"
            - 'columnheader "Kind Column options: Kind Resize Kind"':
              - button "Kind"
              - 'button "Column options: Kind"'
              - separator "Resize Kind"
            - 'columnheader "Price Column options: Price Resize Price"':
              - button "Price"
              - 'button "Column options: Price"'
              - separator "Resize Price"
            - 'columnheader "Stock Column options: Stock Resize Stock"':
              - button "Stock"
              - 'button "Column options: Stock"'
              - separator "Resize Stock"
          - 'row "Filter Name: Match"':
            - gridcell
            - 'gridcell "Filter Name: Match"':
              - 'combobox "Filter Name: Match"': Contains
              - text: ""
              - searchbox "Filter Name"
            - gridcell
            - gridcell
            - gridcell
        - rowgroup:
          - row /P-\d+ Field notes \d+ Book ₺\d+\.\d+ \d+/:
            - gridcell /P-\d+/
            - gridcell /Field notes \d+/
            - gridcell "Book"
            - gridcell /₺\d+\.\d+/
            - gridcell /\d+/
          - row /P-\d+ Garden trowel \d+ Tool ₺\d+\.\d+ \d+/:
            - gridcell /P-\d+/
            - gridcell /Garden trowel \d+/
            - gridcell "Tool"
            - gridcell /₺\d+\.\d+/
            - gridcell /\d+/
          - row /P-\d+ Fern \d+ Plant ₺\d+\.\d+ \d+/:
            - gridcell /P-\d+/
            - gridcell /Fern \d+/
            - gridcell "Plant"
            - gridcell /₺\d+\.\d+/
            - gridcell /\d+/
          - row /P-\d+ City atlas \d+ Book ₺\d+\.\d+ \d+/:
            - gridcell /P-\d+/
            - gridcell /City atlas \d+/
            - gridcell "Book"
            - gridcell /₺\d+\.\d+/
            - gridcell /\d+/
          - row /P-\d+ Hand saw \d+ Tool ₺\d+\.\d+ 5/:
            - gridcell /P-\d+/
            - gridcell /Hand saw \d+/
            - gridcell "Tool"
            - gridcell /₺\d+\.\d+/
            - gridcell "5"
          - row /P-\d+ Olive tree \d+ Plant ₺\d+\.\d+ \d+/:
            - gridcell /P-\d+/
            - gridcell /Olive tree \d+/
            - gridcell "Plant"
            - gridcell /₺\d+\.\d+/
            - gridcell /\d+/
      - navigation "Pagination":
        - button "Previous page" [disabled]: ‹
        - text: /1-6 of \d+/
        - button "Next page": ›
      - group: Show code
      - button "Copy"
      - status