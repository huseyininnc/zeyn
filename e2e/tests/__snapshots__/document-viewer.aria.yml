- main:
  - region "DocumentViewer":
    - heading "DocumentViewer" [level=1]
    - paragraph: A paged report preview whose pages are fetched as they come into view.
    - link "Documentation (external site)":
      - /url: https://docs.zeynsoft.com/components/display#documentviewer
    - link "API reference on docs.rs (external site)":
      - /url: https://docs.rs/zeyn/latest/zeyn/?search=DocumentViewer
    - tablist "DocumentViewer sections":
      - tab "Overview" [selected]
      - tab "API"
      - tab "Examples"
    - tabpanel "Overview":
      - heading "Example" [level=3]
      - region "Sales by order":
        - group "Document tools":
          - button "Previous page" [disabled]
          - text: Page
