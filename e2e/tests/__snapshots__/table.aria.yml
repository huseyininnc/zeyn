- main:
  - region "Table":
    - heading "Table" [level=1]
    - paragraph: A small table of text the screen already holds.
    - link "Documentation (external site)":
      - /url: https://docs.zeynsoft.com/components/data#table
    - link "API reference on docs.rs (external site)":
      - /url: https://docs.rs/zeyn/latest/zeyn/?search=Table
    - tablist "Table sections":
      - tab "Overview" [selected]
      - tab "API"
      - tab "Examples"
    - tabpanel "Overview":
      - heading "Example" [level=3]
      - group "Opening hours":
        - table "Opening hours":
          - caption: Opening hours
          - rowgroup:
            - row "Day Opens Closes":
              - columnheader "Day"
              - columnheader "Opens"
              - columnheader "Closes"
          - rowgroup:
            - row /Monday to Friday \d+:\d+ \d+:\d+/:
              - rowheader "Monday to Friday"
              - cell /\d+:\d+/
              - cell /\d+:\d+/
            - row /Saturday \d+:\d+ \d+:\d+/:
              - rowheader "Saturday"
              - cell /\d+:\d+/
              - cell /\d+:\d+/
            - row "Sunday Closed":
              - rowheader "Sunday"
              - cell "Closed"
              - cell
      - group: Show code
      - button "Copy"
      - status