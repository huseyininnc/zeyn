- main:
  - region "Length input":
    - heading "Length input" [level=1]
    - paragraph: A length stored in pixels and shown in a unit the user picks.
    - link "Documentation (external site)":
      - /url: https://docs.zeynsoft.com/components/controls
    - link "API reference on docs.rs (external site)":
      - /url: https://docs.rs/zeyn/latest/zeyn/?search=LengthUnit
    - tablist "Length input sections":
      - tab "Overview" [selected]
      - tab "API"
    - tabpanel "Overview":
      - heading "Example" [level=3]
      - text: Height
      - spinbutton "Height": /\d+/
      - combobox "Unit":
        - option "mm" [selected]
        - option "cm"
        - option "in"
        - option "pt"
      - text: Padding
      - spinbutton "Padding": "2"
      - combobox "Unit":
        - option "mm" [selected]
        - option "cm"
        - option "in"
        - option "px"
        - option "pt"
      - button "Save"
      - group: Show code
      - button "Copy"
      - status