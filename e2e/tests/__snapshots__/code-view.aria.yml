- main:
  - region "CodeView":
    - heading "CodeView" [level=1]
    - paragraph: Read only code and JSON, highlighted, numbered and folded on the server.
    - link "Documentation (external site)":
      - /url: https://docs.zeynsoft.com/components/admin#codeview-and-jsonview
    - link "API reference on docs.rs (external site)":
      - /url: https://docs.rs/zeyn/latest/zeyn/?search=CodeView
    - tablist "CodeView sections":
      - tab "Overview" [selected]
      - tab "API"
      - tab "Examples"
    - tabpanel "Overview":
      - heading "Example" [level=3]
      - heading "open_orders.sql" [level=2]
      - text: 8 lines
      - button "Copy"
      - region "open_orders.sql":
        - code: "-- Open orders of the last week, newest first"
        - code: SELECT o.number, c.name, o.total
        - code: FROM orders o
        - code: JOIN customers c ON c.id = o.customer_id
        - code: WHERE o.state = 'open'
        - code: AND o.created_at > now() - interval '7 days'
        - code: ORDER BY o.created_at DESC
        - code: /LIMIT \d+;/
      - group: Show code
      - button "Copy"
      - status