- main:
  - region "Barcode":
    - heading "Barcode" [level=1]
    - paragraph: /Code \d+ barcodes and QR codes drawn as SVG on the server\./
    - link "Documentation (external site)":
      - /url: https://docs.zeynsoft.com/components/admin#barcode-and-qrcode
    - link "API reference on docs.rs (external site)":
      - /url: https://docs.rs/zeyn/latest/zeyn/?search=Barcode
    - tablist "Barcode sections":
      - tab "Overview" [selected]
      - tab "API"
      - tab "Examples"
    - tabpanel "Overview":
      - heading "Example" [level=3]
      - img /SO-\d+-\d+/
      - img /Order SO-\d+-\d+/
      - group: Show code
      - button "Copy"
      - status