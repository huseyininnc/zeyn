    - link "Documentation (external site)":
      - /url: https://docs.zeynsoft.com/components/data#flowdiagram
    - link "API reference on docs.rs (external site)":
      - /url: https://docs.rs/zeyn/latest/zeyn/?search=FlowDiagram
    - tablist "FlowDiagram sections":
      - tab "Overview" [selected]
      - tab "API"
      - tab "Examples"
