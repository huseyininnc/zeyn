- main:
  - region "Timeline":
    - heading "Timeline" [level=1]
    - paragraph: Events in order, each with a tone.
    - link "Documentation (external site)":
      - /url: https://docs.zeynsoft.com/components/display#timeline
    - link "API reference on docs.rs (external site)":
      - /url: https://docs.rs/zeyn/latest/zeyn/?search=Timeline
    - tablist "Timeline sections":
      - tab "Overview" [selected]
      - tab "API"
    - tabpanel "Overview":
      - heading "Example" [level=3]
      - list:
        - listitem:
          - paragraph: Created
          - paragraph:
            - time: /\d+\/\d+\/\d+ \d+:\d+:\d+ PM/
        - listitem:
          - paragraph: Approved
          - paragraph:
            - time: /\d+\/\d+\/\d+ \d+:\d+:\d+ AM/
          - paragraph: by the manager
        - listitem:
          - paragraph: Shipped
          - paragraph:
            - time: /\d+\/\d+\/\d+ 2:\d+:\d+ PM/
      - group: Show code
      - button "Copy"
      - status