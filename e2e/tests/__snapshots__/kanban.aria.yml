- main:
  - region "Kanban":
    - heading "Kanban" [level=1]
    - paragraph: Cards in columns of a workflow, moved by drag, a menu or the keyboard.
    - link "Documentation (external site)":
      - /url: https://docs.zeynsoft.com/components/admin#kanban
    - link "API reference on docs.rs (external site)":
      - /url: https://docs.rs/zeyn/latest/zeyn/?search=Kanban
    - tablist "Kanban sections":
      - tab "Overview" [selected]
      - tab "API"
      - tab "Examples"
    - tabpanel "Overview":
      - heading "Example" [level=3]
      - region /Sprint \d+/:
        - heading /Sprint \d+/ [level=2]
        - paragraph: Arrow keys move between cards. Enter opens the move menu; Shift with Left or Right moves the card to the next column.
        - region "Backlog":
          - heading "Backlog" [level=3]
          - text: "3"
          - region "List":
            - list:
              - listitem:
                - paragraph: Price list for spring
                - text: Ada
                - button "Move"
              - listitem:
                - paragraph: Fix the invoice footer
                - text: Alan
                - button "Move"
              - listitem:
                - paragraph: Import the new suppliers
                - text: Grace
                - button "Move"
          - status
        - region "Doing":
          - heading "Doing" [level=3]
          - text: 2 of 2
          - region "List":
            - list:
              - listitem:
                - paragraph: Stock count in Warehouse B
                - text: Linus
                - button "Move"
              - listitem:
                - paragraph: Translate the help pages
                - text: Ada
                - button "Move"
          - status
        - region "Review":
          - heading "Review" [level=3]
          - text: "1"
          - region "List":
            - list:
              - listitem:
                - paragraph: Review the refund policy
                - text: Alan
                - button "Move"
          - status
        - region "Done":
          - heading "Done" [level=3]
          - text: "2"
          - region "List":
            - list:
              - listitem:
                - paragraph: Photos for the tea range
                - text: Grace
                - button "Move"
              - listitem:
                - paragraph: Close the October books
                - text: Linus
                - button "Move"
          - status
        - status
      - group: Show code
      - button "Copy"
      - status