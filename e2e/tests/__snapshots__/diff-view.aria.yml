- main:
  - region "DiffView":
    - heading "DiffView" [level=1]
    - paragraph: The fields that changed in a record, old and new side by side or inline.
    - link "Documentation (external site)":
      - /url: https://docs.zeynsoft.com/components/admin#diffview
    - link "API reference on docs.rs (external site)":
      - /url: https://docs.rs/zeyn/latest/zeyn/?search=DiffView
    - tablist "DiffView sections":
      - tab "Overview" [selected]
      - tab "API"
      - tab "Examples"
    - tabpanel "Overview":
      - heading "Example" [level=3]
      - heading "Changed on 4 November" [level=2]
      - table "Changed on 4 November":
        - rowgroup:
          - row "Field Before After":
            - columnheader "Field"
            - columnheader "Before"
            - columnheader "After"
        - rowgroup:
          - row "City London Paris":
            - rowheader "City"
            - cell "London":
              - deletion: London
            - cell "Paris":
              - insertion: Paris
          - row /Iban •••• 5 \d+ •••• \d+/:
            - rowheader "Iban"
            - cell /•••• 5 \d+/:
              - deletion: /•••• 5 \d+/
            - cell /•••• \d+/:
              - insertion: /•••• \d+/
          - row /Credit limit \d+\.\d+ USD \d+\.\d+ USD/:
            - rowheader "Credit limit"
            - cell /\d+\.\d+ USD/:
              - deletion: /\d+\.\d+ USD/
            - cell /\d+\.\d+ USD/:
              - insertion: /\d+\.\d+ USD/
      - group: Show code
      - button "Copy"
      - status