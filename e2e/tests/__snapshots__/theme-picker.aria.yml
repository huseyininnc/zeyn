- main:
  - region "ThemePicker":
    - heading "ThemePicker" [level=1]
    - paragraph: The theme choice inside a screen, in step with the menu.
    - link "Documentation (external site)":
      - /url: https://docs.zeynsoft.com/components/shell#theme-picker-in-a-screen
