# GitHub Actions for the Zeyn repository: format, lint and test on every push to main or dev
# and on pull requests. The desktop crate builds against WebKitGTK and GTK on Linux.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: sh ci/clippy-features.sh
      - name: Build the workspace with timings
        run: |
          start=$(date +%s)
          cargo build --workspace --timings
          build=$(( $(date +%s) - start ))
          cargo build -p zeyn
          touch crates/zeyn/src/lib.rs
          start=$(date +%s)
          cargo build -p zeyn
          rebuild=$(( $(date +%s) - start ))
          target=$(du -sm target | cut -f1)
          {
            echo "Workspace build: ${build} s"
            echo "One line rebuild of zeyn: ${rebuild} s"
            echo "Target folder: ${target} MB"
          } >> "$GITHUB_STEP_SUMMARY"
          sh ci/check-build-budget.sh "$build" "$rebuild" "$target"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-timings
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 14
      - run: cargo test --workspace
      - run: cargo test -p zeyn --features assistant,oidc,totp,islands,realtime,socket-client,redis,xlsx,email,accounts,image,resumable,metronome-ops
      - run: cargo test -p zeyn-cli

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p zeyn-example-components
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
