# GitHub Actions for the Zeyn repository: format, lint, feature builds and tests run side by side
# and on pull requests. The desktop crate builds against WebKitGTK and GTK on Linux.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Three jobs run side by side and `check` gathers them, so the branch rules need one name.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build the workspace with timings
        run: |
          start=$(date +%s)
          cargo build --workspace --timings
          build=$(( $(date +%s) - start ))
          cargo build -p zeyn
          touch crates/zeyn/src/lib.rs
          start=$(date +%s)
          cargo build -p zeyn
          rebuild=$(( $(date +%s) - start ))
          target=$(du -sm target | cut -f1)
          {
            echo "Workspace build: ${build} s"
            echo "One line rebuild of zeyn: ${rebuild} s"
            echo "Target folder: ${target} MB"
          } >> "$GITHUB_STEP_SUMMARY"
          sh ci/check-build-budget.sh "$build" "$rebuild" "$target"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-timings
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 14

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: sh ci/clippy-features.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # One compile of zeyn for the whole workspace: the examples already turn most features on,
      # so the feature list is added here instead of building zeyn a second time.
      - run: cargo test --workspace --features zeyn/assistant,zeyn/oidc,zeyn/totp,zeyn/islands,zeyn/realtime,zeyn/socket-client,zeyn/redis,zeyn/xlsx,zeyn/email,zeyn/accounts,zeyn/image,zeyn/resumable,zeyn/metronome-ops
      - run: cargo test -p zeyn-cli

  check:
    if: always()
    needs: [lint, features, test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "lint: ${{ needs.lint.result }}, features: ${{ needs.features.result }}, test: ${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.features.result }}" = success
          test "${{ needs.test.result }}" = success

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: audit
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo build -p zeyn-example-components
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test -- --shard=${{ matrix.shard }}/2
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report
          retention-days: 14
