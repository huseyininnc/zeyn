# GitHub Actions for the Zeyn repository: format, lint and test on every push to main or dev
# and on pull requests. The desktop crate builds against WebKitGTK and GTK on Linux.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: sh ci/clippy-features.sh
      - name: Build the workspace with timings
        run: |
          start=$(date +%s)
          cargo build --workspace --timings
          elapsed=$(( $(date +%s) - start ))
          echo "Workspace build: ${elapsed} s" >> "$GITHUB_STEP_SUMMARY"
          sh ci/check-build-budget.sh "$elapsed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-timings
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 14
      - run: cargo test --workspace
      - run: cargo test -p zeyn --features assistant,oidc,totp,islands,realtime,socket-client,redis,xlsx,email,accounts,image,resumable
      - run: cargo test -p zeyn-cli

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
