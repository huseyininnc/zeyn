name: Feature request
description: Suggest a new feature or a change to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you?
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: How would the feature look in app code? A short Rust sketch helps.
      render: rust
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What did you try or consider instead, including how the existing components could cover it?
    validations:
      required: true
