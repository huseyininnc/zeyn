[package]
name = "zeyn-example-billing"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
zeyn = { path = "../../crates/zeyn" }
shared-domain = { path = "../shared-domain", package = "zeyn-example-shared-domain" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
serde_json = "1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
