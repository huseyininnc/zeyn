[package]
name = "zeyn-example-showcase"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
# Invoice and list report PDFs. Off by default: Typst is large, and turning it on in the
# workspace links it into every test binary. Run with `cargo run -p zeyn-example-showcase --features pdf`.
pdf = ["zeyn/pdf"]

[dependencies]
zeyn = { path = "../../crates/zeyn", features = ["assistant", "islands", "realtime", "xlsx", "email"] }
showcase-shared = { path = "shared", features = ["crdt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
