[package]
name = "showcase-island-diagram"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# Diagram editor island on the Zeyn canvas surface.
[lib]
name = "diagram"
crate-type = ["cdylib", "rlib"]

[dependencies]
showcase-shared = { path = "../../shared" }
zeyn-island = { path = "../../../../crates/zeyn-island", features = ["canvas"] }
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "CssStyleDeclaration", "Window", "CanvasRenderingContext2d", "TextMetrics"] }
