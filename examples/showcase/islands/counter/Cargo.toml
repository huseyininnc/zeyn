[package]
name = "showcase-island-counter"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# A small WASM island: `zeyn build-islands` in examples/showcase compiles it.
[lib]
name = "counter"
crate-type = ["cdylib", "rlib"]

[dependencies]
showcase-shared = { path = "../../shared" }
zeyn-island = { path = "../../../../crates/zeyn-island", features = ["client"] }
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "HtmlButtonElement", "Event", "EventTarget"] }
