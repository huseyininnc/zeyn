[package]
name = "zeyn-example-docs"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
zeyn = { path = "../../crates/zeyn", features = ["lang-all"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
